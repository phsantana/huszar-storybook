<script>
/* Tokens do Huszár DS (espelho das coleções Primitive e Semantic do Figma) */
const PRIM = {
  Neutral: ['#ffffff','#f5f5f5','#e5e5e5','#d4d4d4','#a3a3a3','#737373','#525252','#404040','#262626','#171717'],
  Twilight: ['#fce7f4','#f9c3e6','#f28cce','#e64aaf','#d10a87','#b00973','#8d075d','#690646','#46042f'],
  Sunset: ['#f5e7e8','#e2babe','#cc858b','#b24750','#980a16','#800812','#66070f','#4c050b','#320307'],
  Sunny: ['#fce8e7','#f7bdbc','#f08a88','#e94f4c','#e11410','#bd110d','#970d0b','#710a08','#4a0705'],
  Midday: ['#fef3e7','#fcdeba','#fac485','#f7a747','#f4890a','#cd7308','#a35c07','#7a4505','#512d03'],
  Bluesky: ['#eafaf9','#c5f1ef','#98e7e3','#65dad4','#31cec6','#29ada6','#218a85','#196763','#104441'],
  Grass: ['#e9f5e7','#c2e2bc','#92cc87','#5bb34b','#24990f','#1e810d','#18670a','#124d08','#0c3205'],
  Dawn: ['#ece8ef','#cabfd3','#a08eb1','#715589','#411c62','#371852','#2c1342','#210e31','#150920'],
  Night: ['#03030f'],
};
const PRIM_STEPS = { Neutral: [50,100,200,300,400,500,600,700,800,900], Night: [500] };
const STEPS9 = [100,200,300,400,500,600,700,800,900];
const primList = [];
for (const fam in PRIM) PRIM[fam].forEach((hex, i) => { const step = (PRIM_STEPS[fam] || STEPS9)[i]; primList.push({ fam, step, name: fam + '/' + step, css: '--' + fam.toLowerCase() + '-' + step, hex: hex.toUpperCase() }); });
const primByName = Object.fromEntries(primList.map(p => [p.name, p]));

/* [token, referência] — tokens que apontam para outro semântico usam o nome completo */
const SEM_GROUPS = [
  ['Fundo', 'bg', [['bg/page','Neutral/50'],['bg/surface','Neutral/50'],['bg/subtle','Neutral/100'],['bg/brand-subtle','Twilight/100']]],
  ['Texto', 'text', [['text/primary','Neutral/900'],['text/secondary','Neutral/600'],['text/on-action','Neutral/50'],['text/brand','Twilight/500']]],
  ['Borda', 'border', [['border/default','Neutral/300'],['border/strong','Neutral/400']]],
  ['Ação', 'action', [['action/primary','Twilight/500'],['action/primary-hover','Twilight/600'],['action/primary-subtle','Twilight/100']]],
  ['Feedback', 'feedback', [['feedback/success','Grass/500'],['feedback/success-subtle','Grass/100'],['feedback/danger','Sunny/500'],['feedback/danger-subtle','Sunny/100'],['feedback/warning','Midday/500'],['feedback/warning-subtle','Midday/100'],['feedback/info','Bluesky/700'],['feedback/info-subtle','Bluesky/100']]],
  ['Ícone', 'icon', [['icon/default','Neutral/900'],['icon/secondary','Neutral/600'],['icon/disabled','Neutral/400'],['icon/on-action','color/text/on-action'],['icon/brand','Twilight/500'],['icon/success','Grass/500'],['icon/danger','Sunny/500'],['icon/warning','Midday/500'],['icon/info','Bluesky/700']]],
];
const semList = [];
SEM_GROUPS.forEach(([label, key, items]) => items.forEach(([n, ref]) => semList.push({ group: key, name: 'color/' + n, css: '--color-' + n.replace(/\//g, '-'), ref })));
const semByName = Object.fromEntries(semList.map(s => [s.name, s]));
function resolveRef(ref) { if (primByName[ref]) return ref; const s = semByName[ref]; return s ? resolveRef(s.ref) : ref; }
semList.forEach(s => { s.prim = resolveRef(s.ref); s.hex = primByName[s.prim].hex; });

const SPACING = { '2xsm':4, xsm:8, sm:16, m:24, lg:32, xlg:40, '2xlg':48, '3xlg':56, '4xlg':64, '5xlg':72, '6xlg':80, '7xlg':88, '8xlg':96 };
const RADIUS = { '4xsm':4, '3xsm':8, '2xsm':12, xsm:16, sm:20, m:24, lg:28, xlg:32, '2xlg':36, '3xlg':40, '4xlg':44, '5xlg':48, pill:1000 };

/* CSS com as variáveis */
function buildCss() {
  let c = ':root {\n  /* Primitive */\n';
  primList.forEach(p => c += `  ${p.css}: ${p.hex.toLowerCase()};\n`);
  c += '\n  /* Semantic */\n';
  semList.forEach(s => c += `  ${s.css}: var(${s.ref.startsWith('color/') ? semByName[s.ref].css : primByName[s.ref].css});\n`);
  c += '\n  /* Spacing */\n';
  for (const k in SPACING) c += `  --spacing-${k}: ${SPACING[k]}px;\n`;
  c += '\n  /* Radius */\n';
  for (const k in RADIUS) c += `  --radius-${k}: ${RADIUS[k]}px;\n`;
  return c + '}\n';
}

/* Configuração do Tailwind */
const TW = {
  colors: { transparent: 'transparent', current: 'currentColor' },
  spacing: {}, borderRadius: { none: '0', full: '9999px' },
  fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'], display: ['Montserrat', 'Inter', 'system-ui', 'sans-serif'] },
  fontSize: {
    eyebrow: ['0.75rem', { lineHeight: '1.5', letterSpacing: '0.08em' }],
    h1: ['2.875rem', { lineHeight: '1.3' }], h2: ['2rem', { lineHeight: '1.3' }], h3: ['1.75rem', { lineHeight: '1.3' }],
    h4: ['1.5625rem', { lineHeight: '1.3' }], h5: ['1.375rem', { lineHeight: '1.3' }], h6: ['1.25rem', { lineHeight: '1.3' }],
    'h1-m': ['2rem', { lineHeight: '1.3' }], 'h2-m': ['1.5625rem', { lineHeight: '1.3' }], 'h3-m': ['1.375rem', { lineHeight: '1.3' }],
    'h4-m': ['1.25rem', { lineHeight: '1.3' }], 'h5-m': ['1.125rem', { lineHeight: '1.3' }], 'h6-m': ['1rem', { lineHeight: '1.3' }],
    'body-lg': ['1.125rem', { lineHeight: '1.5' }], body: ['1rem', { lineHeight: '1.5' }],
    'desc-lg': ['0.875rem', { lineHeight: '1.5' }], desc: ['0.75rem', { lineHeight: '1.5' }],
  },
};
primList.forEach(p => { const f = p.fam.toLowerCase(); (TW.colors[f] = TW.colors[f] || {})[p.step] = `var(${p.css})`; });
semList.forEach(s => { const [, g, k] = s.name.split('/'); (TW.colors[g] = TW.colors[g] || {})[k] = `var(${s.css})`; });

for (const k in RADIUS) TW.borderRadius[k] = RADIUS[k] + 'px';

  const j = o => JSON.stringify(o, null, 2).replace(/"([A-Za-z_$][\w$]*)":/g, '$1:').replace(/"/g, "'");

}
/* O site usa o próprio tema (sem extend de cores, para só aceitar tokens) */
window.tailwind = window.tailwind || {};
tailwind.config = { theme: { colors: TW.colors, extend: { spacing: TW.spacing, borderRadius: TW.borderRadius, fontFamily: TW.fontFamily, fontSize: TW.fontSize } } };

</script>

  icon: [['O que é', 'Cores específicas para ícones, separadas das de texto para permitir ajustes independentes.'], ['Quando usar', 'default para ícones comuns; secondary para ícones de apoio; disabled para estados desabilitados; on-action sobre fundos de ação; brand para destaque da marca; success, danger, warning e info para status.'], ['Onde usar', 'Ícone, Ícone com descrição e ícones dentro de Botão e Input.'], ['Evite', 'Usar cores color/text/* em ícones, e cores color/icon/* em texto.']],
};
function copyChip(text, display) { const id = storeCode(text); return `<button type="button" data-copy="${id}" title="Copiar ${escA(text)}" class="rounded-4xsm px-2xsm text-left font-mono text-desc text-text-secondary hover:bg-bg-subtle hover:text-text-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-text-primary">${display || esc(text)}</button>`; }
function renderCores() {
  const fams = [...new Set(primList.map(p => p.fam))];
  const prim = fams.map(f => `<div class="flex flex-col gap-m">${blockHead(f, `${primList.filter(p => p.fam === f).length} ${primList.filter(p => p.fam === f).length > 1 ? 'tons' : 'tom'} · coleção Primitive`)}<div class="flex flex-wrap gap-xsm">${primList.filter(p => p.fam === f).map(p => `<div class="flex w-[117px] flex-col gap-xsm"><span class="h-16 w-full rounded-3xsm border border-border-default" style="background:var(${p.css})"></span><span class="text-body text-text-primary">${p.step}</span>${copyChip(p.hex, p.hex)}</div>`).join('')}</div></div>`).join('');
  const sem = SEM_GROUPS.map(([label, key, items]) => {
    const list = semList.filter(s => s.group === key);
    const desc = `<div class="flex flex-col gap-sm">${SEM_DESC[key].map(([a, b]) => `<div class="flex flex-col gap-2xsm md:flex-row md:gap-m"><p class="shrink-0 text-eyebrow font-bold uppercase text-text-secondary md:w-40">${a}</p><p class="max-w-[640px] text-body text-text-primary">${esc(b)}</p></div>`).join('')}</div>`;
    return `<div class="flex flex-col gap-m">${blockHead(label, `${list.length} tokens · color/${key}/*`)}${desc}${table(['Amostra', 'Token', 'Variável CSS', 'Referência', 'Hex'], list.map(s => [swatch(s.css), `${esc(s.name)}`, copyChip(`var(${s.css})`), esc(s.ref.replace('color/', 'color/')), s.hex]))}</div>`;
  }).join('');
  return `<div class="flex flex-col gap-6xlg"><header class="flex flex-col gap-xsm"><p class="text-eyebrow font-bold uppercase text-text-secondary">FUNDAMENTO</p><h1 class="font-display text-h1-m font-bold text-text-primary md:text-h1">Cores</h1><p class="text-desc text-text-secondary">${primList.length + semList.length} tokens de cor · ${primList.length} primitivos (coleção Primitive) · ${semList.length} semânticos (coleção Semantic). Clique em um valor para copiá-lo.</p></header>
  ${section('Tokens primitivos', `<p class="max-w-[640px] text-desc-lg text-text-secondary">Valores brutos da paleta, organizados por família e escala. Não são usados diretamente nos componentes: os tokens semânticos apontam para eles.</p>${prim}`)}
  ${section('Tokens semânticos', `<p class="max-w-[640px] text-desc-lg text-text-secondary">Tokens com função definida. São os únicos que os componentes devem usar; cada um aponta para um token primitivo.</p>${sem}`)}</div>`;
}
function renderTipografia() {
  const rows = TYPE_STYLES.map(([n, font, px, lh, cls, extra, sample]) => [`<span class="${extra} text-${cls} text-text-primary" style="${cls === 'eyebrow' ? 'color:var(--color-text-secondary)' : ''}">${sample}</span>`, esc(n), esc(font), `${px} px · ${(px / 16).toString().replace('.', ',')} rem`, lh, copyChip(`text-${cls}${extra ? ' ' + extra : ''}`)]);
  return `<div class="flex flex-col gap-6xlg"><header class="flex flex-col gap-xsm"><p class="text-eyebrow font-bold uppercase text-text-secondary">FUNDAMENTO</p><h1 class="font-display text-h1-m font-bold text-text-primary md:text-h1">Tipografia</h1><p class="text-desc text-text-secondary">${TYPE_STYLES.length} estilos · Inter e Montserrat · base de cálculo para rem: 16 px</p></header>
  ${section('Diretrizes', `<ul class="flex max-w-[640px] flex-col gap-sm">${TYPE_RULES.map(r => `<li class="flex gap-sm text-body text-text-primary"><span class="mt-2xsm shrink-0 text-icon-brand [&>svg]:h-4 [&>svg]:w-4">${svg('check')}</span><span>${esc(r)}</span></li>`).join('')}</ul>`)}
  ${section('Estilos de texto', `${blockHead('Estilos, valores em rem e classes Tailwind', 'clique na classe para copiar · títulos usam font-display (Montserrat), o restante usa Inter')}${table(['Amostra', 'Estilo', 'Fonte', 'Tamanho', 'Line-height', 'Classe Tailwind'], rows)}`)}</div>`;
}
function gridViz(g) {
  const cols = Array.from({ length: g.cols }, () => `<span class="block shrink-0 bg-action-primary" style="width:${g.w}px;height:24px"></span>`).join('');
  return `<div class="overflow-x-auto rounded-xsm bg-bg-subtle py-m"><div class="mx-auto flex w-max flex-col gap-xsm px-sm"><div class="relative h-8 text-desc text-text-secondary" style="width:${g.total}px">${[[0, g.w, g.w + 'px'], [g.w, g.gap, g.gap + 'px']].map(([x, w, l]) => `<span class="absolute top-0 flex -translate-x-1/2 flex-col items-center gap-2xsm" style="left:${x + w / 2}px"><span>${l}</span><span class="relative block h-2 border-b border-text-secondary" style="width:${w}px"><i class="absolute left-0 top-0 h-2 w-px bg-text-secondary"></i><i class="absolute right-0 top-0 h-2 w-px bg-text-secondary"></i></span></span>`).join('')}</div><div class="flex" style="gap:${g.gap}px">${cols}</div></div></div>`;
}
function renderGrids() {
  const blocks = GRIDS.map(g => {
    const css = g.nome === 'Desktop' ? `grid grid-cols-[repeat(12,80px)] gap-m` : `grid grid-cols-[repeat(6,32px)] gap-m`;
    const snippet = `<div className="${css}">\n  {/* ${g.cols} colunas de ${g.w}px, com ${g.gap}px entre elas */}\n</div>`;
    return section('Grid ' + g.nome, `${blockHead(g.nome, `tela de ${g.tela} · ${g.cols} colunas · ${g.w} px de largura cada · ${g.gap} px de distância entre elas (spacing/m)`)}${gridViz(g)}${grid2([`<div class="flex flex-col gap-lg">${blockHead('Especificações', '')}${[[g.cols + ' colunas', 'quantidade de colunas'], [g.w + ' px', 'largura de cada coluna'], [g.gap + ' px', 'espaço entre colunas (gutter) · spacing/m'], [g.total + ' px', `largura total do grid · ${g.cols} × ${g.w} px + ${g.cols - 1} × ${g.gap} px`], [g.tela, 'largura de tela de referência']].map(([a, b]) => `<div class="flex flex-col gap-2xsm"><p class="text-body text-text-primary">${a}</p><p class="text-desc text-text-secondary">${b}</p></div>`).join('')}</div>`, `<div class="flex flex-col gap-lg">${blockHead('Código', 'grid fixo com Tailwind')}${codeBlock(snippet, 'React + Tailwind')}</div>`])}`);
  }).join('');
  const cmp = section('Comparativo', table(['Propriedade', 'Desktop', 'Mobile'], [['Largura de tela', GRIDS[0].tela, GRIDS[1].tela], ['Colunas', '12', '6'], ['Largura da coluna', '80 px', '32 px'], ['Gutter', '24 px (spacing/m)', '24 px (spacing/m)'], ['Largura total do grid', '1224 px', '312 px']]));
  return `<div class="flex flex-col gap-6xlg"><header class="flex flex-col gap-xsm"><p class="text-eyebrow font-bold uppercase text-text-secondary">FUNDAMENTO</p><h1 class="font-display text-h1-m font-bold text-text-primary md:text-h1">Grids</h1><p class="text-desc text-text-secondary">2 grids · Desktop e Mobile · colunas na cor color/action/primary · gutter com token da coleção Semantic</p></header>${blocks}${cmp}</div>`;
}
function renderInicio() {
  const fonts = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">';
  const usage = '<button className="rounded-pill bg-action-primary px-m py-sm text-desc-lg font-bold text-text-on-action">\n  Ver ingressos\n</button>';
  const ref = table(['Categoria', 'Prefixos', 'Exemplos'], [['Cor', 'bg- · text- · border- · ring-', 'bg-bg-surface · text-text-secondary · border-border-default · ring-action-primary'], ['Primitivos', 'família-escala', 'bg-twilight-500 · text-dawn-500 · bg-neutral-100'], ['Spacing', 'p- · m- · gap-', 'p-m · gap-xsm · px-sm · py-2xsm'], ['Raio', 'rounded-', 'rounded-pill · rounded-xsm · rounded-4xsm'], ['Tipografia', 'text-', 'text-h1 · text-body · text-desc-lg · font-display'], ['Variáveis CSS', 'var(--…)', 'var(--color-text-primary) · var(--spacing-m) · var(--radius-pill)']]);
  return `<div class="flex flex-col gap-6xlg"><header class="flex flex-col gap-xsm"><p class="text-eyebrow font-bold uppercase text-text-secondary">COMEÇAR</p><h1 class="font-display text-h1-m font-bold text-text-primary md:text-h1">Primeiros passos</h1><p class="max-w-[640px] text-desc-lg text-text-secondary">O Huszár DS é o sistema de design da Rolê Agora. Os componentes deste Storybook usam apenas tokens: configure o tema uma vez e copie o código de cada componente.</p></header>
  ${section('1. Fontes', `<p class="max-w-[640px] text-desc-lg text-text-secondary">O DS usa Inter (texto) e Montserrat (títulos). Adicione ao <code>head</code> do app:</p>${codeBlock(fonts, 'HTML')}`)}
  ${section('2. Tema do Tailwind', `<p class="max-w-[640px] text-desc-lg text-text-secondary">Cole as cores, os espaçamentos, os raios e os tamanhos de fonte do DS no <code>tailwind.config.js</code>. As classes dos exemplos dependem dele.</p>${codeBlock(buildTwConfig(), 'tailwind.config.js')}`)}
  ${section('3. Variáveis CSS', `<p class="max-w-[640px] text-desc-lg text-text-secondary">O tema usa estas variáveis. Inclua o arquivo no CSS global do app.</p>${codeBlock(buildCss(), 'tokens.css')}`)}
  ${section('4. Usar os tokens', `<p class="max-w-[640px] text-desc-lg text-text-secondary">Os nomes das classes seguem os nomes dos tokens do Figma.</p>${codeBlock(usage, 'React + Tailwind')}${ref}`)}</div>`;
}

function renderPage() {
  const el = $('#page');
  el.innerHTML = current === 'inicio' ? renderInicio() : current === 'cores' ? renderCores() : current === 'tipografia' ? renderTipografia() : current === 'grids' ? renderGrids() : renderComponent(current);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nav],[data-copy],[data-pg-set],[data-pg-toggle],[data-code-tab],[data-pg-stage],[data-set],[data-toggle],[data-noop],#menuBtn,#scrim');
  if (!t) return;
  if (t.hasAttribute('data-nav')) return go(t.dataset.nav);
  if (t.id === 'menuBtn') return openMenu();
  if (t.id === 'scrim') return closeMenu();
  if (t.hasAttribute('data-copy')) {
    const ok = await copyText(CODE_STORE[t.dataset.copy]);
    const span = t.querySelector('span') || t; const old = span.innerHTML;
    span.textContent = ok ? 'Copiado!' : 'Selecione e copie'; setTimeout(() => { span.innerHTML = old; }, 1400);
    return;
  }
  if (t.hasAttribute('data-noop')) return e.preventDefault();
  const root = $('#pg'); if (!root) return;
  const id = root.dataset.id, s = pgState[id], d = PG[id];
  if (t.hasAttribute('data-pg-set') && t.tagName === 'BUTTON') { s[t.dataset.pgSet] = t.dataset.v; if (d.onChange) d.onChange(s, t.dataset.pgSet); return pgRefresh(true); }
  if (t.hasAttribute('data-pg-toggle')) { s[t.dataset.pgToggle] = !s[t.dataset.pgToggle]; return pgRefresh(true); }
  if (t.hasAttribute('data-code-tab')) { codeTab = t.dataset.codeTab; return pgRefresh(false); }
  if (t.hasAttribute('data-pg-stage')) { s.stage = t.dataset.pgStage || null; root.querySelectorAll('[data-pg-stage]').forEach(b => { const on = (b.dataset.pgStage || '') === (s.stage || ''); b.setAttribute('aria-pressed', on); b.className = `rounded-pill px-sm py-2xsm text-desc ${on ? 'bg-bg-surface font-bold text-action-primary shadow-sm' : 'text-text-secondary hover:text-text-primary'}`; }); return pgRefresh(false); }
  if (t.hasAttribute('data-set') && !t.disabled) { const [k, v] = t.dataset.set.split('='); s[k] = v; return pgRefresh(true); }
  if (t.hasAttribute('data-toggle') && !t.disabled) { s[t.dataset.toggle] = !s[t.dataset.toggle]; return pgRefresh(true); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches('[data-pg-set]') || t.tagName !== 'SELECT') return;
  const root = $('#pg'); const id = root.dataset.id, s = pgState[id], d = PG[id];
  s[t.dataset.pgSet] = t.value; if (d.onChange) d.onChange(s, t.dataset.pgSet); pgRefresh(true);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { navFilter = t.value; renderSidebar(); return; }
  if (!t.matches('[data-pg-text]')) return;
  const root = $('#pg'); pgState[root.dataset.id][t.dataset.pgText] = t.value; pgRefresh(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  if (e.key === 'Enter' && e.target.id === 'search') { const q = norm(navFilter); const hit = [...DOCS.map(d => [d.id, d.n]), ...FOUNDATIONS, ['inicio', 'Primeiros passos']].find(([, n]) => norm(n).includes(q)); if (hit) go(hit[0]); }
});

/* ---------- Início ---------- */
(function boot() {
  let start = 'botao';
  try { const h = (location.hash || '').replace('#', ''); if (ROUTES.has(h)) start = h; } catch (e) { /* ignore */ }
  go(start, { keepScroll: true });
})();

</script>
